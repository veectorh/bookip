<script>
  // Shared layout interactions & Responsive handling
  const app = document.getElementById('app');
  const device = document.getElementById('device');
  let railed = false;

  function getAutoLayout() {
    const w = window.innerWidth;
    if (w < 768) return { width: 'mobile', layout: 'mob' };
    if (w < 1024) return { width: 'tablet', layout: 'rail' };
    return { width: 'desktop', layout: railed ? 'rail' : 'desktop' };
  }

  function apply() {
    const auto = getAutoLayout();
    const layout = auto.layout;

    app.setAttribute('data-layout', layout);

    const isCollapsed = layout === 'rail';
    document.querySelectorAll('#railBtn, #railBtn2').forEach(b => {
      const use = b.querySelector('use');
      if (use) use.setAttribute('href', isCollapsed ? '#i-panel-left-open' : '#i-panel-left-close');
    });
    const topBtnText = document.querySelector('#railBtn span');
    if (topBtnText) topBtnText.textContent = isCollapsed ? 'Expand menu' : 'Collapse menu';
  }

  // Rail toggle
  document.querySelectorAll('#railBtn, #railBtn2').forEach(b => {
    b.onclick = () => { railed = !railed; apply(); };
  });

  // Window resize listener for natural responsiveness
  window.addEventListener('resize', apply);

  // Close overlays
  function closePopovers() {
    document.querySelectorAll('.popover, .scrim, .sheetwrap, .drawerwrap, .mobilenavwrap').forEach(e => e.remove());
  }
  
  function createScrim() {
    const s = document.createElement('div');
    s.className = 'scrim fixed inset-0 z-40 bg-transparent';
    s.onclick = closePopovers;
    document.body.appendChild(s);
    return s;
  }

  // Business switcher dropdown
  const switcherBtn = document.getElementById('switcherBtn');

    switcherBtn.onclick = e => {
      if (document.querySelector('.popover')) return closePopovers();

      p.style.left = (r.left + window.scrollX) + 'px';

          <span class="leading-tight"><b class="font-medium text-ink block">Otuevbo Development</b><span class="text-muted text-xs">Owner</span></span>

        </button>
        <button class="flex items-center gap-2.5 w-full bg-transparent border-0 px-3 py-2.5 rounded text-left text-[13px] hover:bg-th transition-colors">
          <svg class="w-4 h-4 stroke-[1.75] shrink-0 text-muted" aria-hidden="true"><use href="#i-building-2"/></svg>
          <span class="leading-tight"><b class="font-medium text-ink block">Awufafro Store</b><span class="text-muted text-xs">Accountant</span></span>
        </button>
        <hr class="border-0 border-t border-line my-1.5">
        <button class="flex items-center gap-2.5 w-full bg-transparent border-0 px-3 py-2 rounded text-left text-[13px] text-muted hover:text-ink hover:bg-th transition-colors">

      document.body.appendChild(p);
    };
  }

            <a href="/customers.html" class="flex items-center gap-2.5 px-2.5 h-[36px] rounded text-navy-fg hover:bg-navy-hover hover:text-white text-[13px] font-medium"><svg class="w-5 h-5 stroke-2 shrink-0"><use href="#i-users"/></svg> Customers</a>
            <div class="text-[11px] text-navy-mute px-2.5 pt-3 pb-1 uppercase font-semibold">Purchasing</div>
            <a href="/purchases.html" class="flex items-center gap-2.5 px-2.5 h-[36px] rounded text-navy-fg hover:bg-navy-hover hover:text-white text-[13px] font-medium"><svg class="w-5 h-5 stroke-2 shrink-0"><use href="#i-shopping-bag"/></svg> Purchases</a>
            <a href="/vendors.html" class="flex items-center gap-2.5 px-2.5 h-[36px] rounded text-navy-fg hover:bg-navy-hover hover:text-white text-[13px] font-medium"><svg class="w-5 h-5 stroke-2 shrink-0"><use href="#i-truck"/></svg> Vendors</a>
            <div class="text-[11px] text-navy-mute px-2.5 pt-3 pb-1 uppercase font-semibold">People</div>
            <a href="/employees.html" class="flex items-center gap-2.5 px-2.5 h-[36px] rounded text-navy-fg hover:bg-navy-hover hover:text-white text-[13px] font-medium"><svg class="w-5 h-5 stroke-2 shrink-0"><use href="#i-contact"/></svg> Employees</a>
            <a href="/attendance.html" class="flex items-center gap-2.5 px-2.5 h-[36px] rounded text-navy-fg hover:bg-navy-hover hover:text-white text-[13px] font-medium"><svg class="w-5 h-5 stroke-2 shrink-0"><use href="#i-calendar-check"/></svg> Attendance</a>
            <a href="/payroll.html" class="flex items-center gap-2.5 px-2.5 h-[36px] rounded text-navy-fg hover:bg-navy-hover hover:text-white text-[13px] font-medium"><svg class="w-5 h-5 stroke-2 shrink-0"><use href="#i-banknote"/></svg> Payroll</a>
          </div>
        </div>
      `;
      if (!document.getElementById('slideInLeft-style')) {
        const s = document.createElement('style');
        s.id = 'slideInLeft-style';
        s.textContent = '@keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }';
        document.head.appendChild(s);
      }
      document.body.appendChild(w);
    };
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopovers(); });
  apply();
</script>

  <!-- Global Modals & Drawers Logic -->
  <script>
    // Open drawer
    document.querySelectorAll('[data-drawer-target]').forEach(b => {
      b.addEventListener('click', e => {
        e.preventDefault();
        const id = b.dataset.drawerTarget;
        const el = document.getElementById(id);
        if(el) {
          el.classList.remove('hidden');
          // small delay to allow display block to render before opacity transition
          setTimeout(() => el.setAttribute('data-open', 'true'), 10);
        }
      });
    });
    
    // Close drawer
    document.querySelectorAll('[data-drawer-close]').forEach(b => {
      b.addEventListener('click', e => {
        e.preventDefault();
        const id = b.dataset.drawerClose;
        const el = document.getElementById(id);
        if(el) {
          el.setAttribute('data-open', 'false');
          // wait for transition to end before hiding
          setTimeout(() => el.classList.add('hidden'), 200); 
        }
      });
    });

    // Open modal
    document.querySelectorAll('[data-modal-target]').forEach(b => {
      b.addEventListener('click', e => {
        e.preventDefault();
        const id = b.dataset.modalTarget;
        const el = document.getElementById(id);
        if(el) {
          el.classList.remove('hidden');
          setTimeout(() => el.setAttribute('data-open', 'true'), 10);
        }
      });
    });
    
    // Close modal
    document.querySelectorAll('[data-modal-close]').forEach(b => {
      b.addEventListener('click', e => {
        e.preventDefault();
        const id = b.dataset.modalClose;
        const el = document.getElementById(id);
        if(el) {
          el.setAttribute('data-open', 'false');
          setTimeout(() => el.classList.add('hidden'), 200);
        }
      });
    });
  </script>

  <!-- App-wide Universal Interactions (Nav groups, Quick menu, Notifications, Screen transitions) -->
  <script>
    // Sidebar Nav Group Accordion Toggle
    function toggleNavGroup(btn) {
      const group = btn.closest('.nav-group');
      if (!group) return;
      const isOpen = group.getAttribute('data-open') === 'true';
      group.setAttribute('data-open', isOpen ? 'false' : 'true');
    }

    // Quick Actions Menu Toggle
    const quickMenuBtn = document.getElementById('quickMenuBtn');
    const quickMenuDropdown = document.getElementById('quickMenuDropdown');
    if (quickMenuBtn && quickMenuDropdown) {
      quickMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !quickMenuDropdown.classList.contains('hidden');
        if (notifPanel) notifPanel.classList.add('hidden');
        quickMenuDropdown.classList.toggle('hidden', isOpen);
      });
    }

    // Notifications Panel Toggle & Tab Switching
    const notifBellBtn = document.getElementById('notifBellBtn');
    const notifPanel = document.getElementById('notifPanel');
    if (notifBellBtn && notifPanel) {
      notifBellBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !notifPanel.classList.contains('hidden');
        if (quickMenuDropdown) quickMenuDropdown.classList.add('hidden');
        notifPanel.classList.toggle('hidden', isOpen);
      });

      // Notification tabs
      document.querySelectorAll('[data-notif-tab]').forEach(tabBtn => {
        tabBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const target = tabBtn.dataset.notifTab;
          document.querySelectorAll('[data-notif-tab]').forEach(b => {
            const isTarget = b.dataset.notifTab === target;
            b.classList.toggle('border-indigo', isTarget);
            b.classList.toggle('text-indigo', isTarget);
            b.classList.toggle('font-semibold', isTarget);
            b.classList.toggle('border-transparent', !isTarget);
            b.classList.toggle('text-muted', !isTarget);
          });
          const tabOwed = document.getElementById('tab-owed-to-you');
          const tabYouOwe = document.getElementById('tab-you-owe');
          if (tabOwed) tabOwed.classList.toggle('hidden', target !== 'owed-to-you');
          if (tabYouOwe) tabYouOwe.classList.toggle('hidden', target !== 'you-owe');
        });
      });
    }

    // Close topbar popups when clicking outside
    document.addEventListener('click', (e) => {
      if (quickMenuDropdown && !quickMenuDropdown.contains(e.target) && e.target !== quickMenuBtn) {
        quickMenuDropdown.classList.add('hidden');
      }
      if (notifPanel && !notifPanel.contains(e.target) && !notifBellBtn.contains(e.target)) {
        notifPanel.classList.add('hidden');
      }
    });

    // Global Screen Switching (List, Editor, View, Profile)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-goto]');
      if (!btn) return;
      const target = btn.dataset.goto;
      const screens = ['s-list', 's-editor', 's-view', 's-profile'];
      screens.forEach(sId => {
        const el = document.getElementById(sId);
        if (el) {
          el.classList.toggle('hidden', sId !== `s-${target}`);
        }
      });
      window.scrollTo({ top: 0, behavior: 'instant' });
    });

    // Toast Notification System
    window.showToast = function({ title, message, type = 'success', duration = 4000, actionLabel, onAction }) {
      let container = document.getElementById('toastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.setAttribute('aria-live', 'polite');
        container.className = 'fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-start gap-3 p-3.5 bg-surface border rounded-lg shadow-xl text-[13px] transition-all duration-200 transform translate-y-2 opacity-0';
      
      let iconSvg = '<svg class="w-4 h-4 text-[#1E9A5A] shrink-0 mt-0.5 stroke-[2]"><use href="#i-check"/></svg>';
      let borderClass = 'border-[#C8EAD6]';
      if (type === 'danger' || type === 'error') {
        iconSvg = '<svg class="w-4 h-4 text-[#D0432F] shrink-0 mt-0.5 stroke-[2]"><use href="#i-alert-circle"/></svg>';
        borderClass = 'border-[#F5CFC9]';
      } else if (type === 'info') {
        iconSvg = '<svg class="w-4 h-4 text-indigo shrink-0 mt-0.5 stroke-[2]"><use href="#i-bell"/></svg>';
        borderClass = 'border-indigo-line';
      }

      toast.classList.add(borderClass);

      toast.innerHTML = `
        ${iconSvg}
        <div class="flex-1 min-w-0">
          ${title ? `<div class="font-semibold text-ink leading-tight mb-0.5">${title}</div>` : ''}
          <div class="text-muted leading-normal">${message || ''}</div>
          ${actionLabel ? `<button type="button" class="mt-2 text-xs font-semibold text-indigo hover:text-indigo-hover underline underline-offset-2 action-btn">${actionLabel}</button>` : ''}
        </div>
        <button type="button" class="text-muted hover:text-ink -mr-1 -mt-1 p-1 rounded close-btn" aria-label="Dismiss">
          <svg class="w-3.5 h-3.5 stroke-[2]"><use href="#i-x-circle"/></svg>
        </button>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      }, 10);

      const dismiss = () => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 200);
      };

      toast.querySelector('.close-btn').onclick = dismiss;

      if (actionLabel && onAction) {
        toast.querySelector('.action-btn').onclick = () => {
          onAction();
          dismiss();
        };
      }

      if (duration > 0) {
        setTimeout(dismiss, duration);
      }
    };

        `;
      }

      function wireMenuActions(wrapper) {
        wrapper.querySelector('.menu-action-view')?.addEventListener('click', () => {
          closePopovers();
          const viewEl = document.getElementById('s-view');
          if (viewEl) {
            document.querySelectorAll('#s-list, #s-editor, #s-view').forEach(s => s.classList.add('hidden'));
            viewEl.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'instant' });
          } else {
            window.showToast({ title: 'Viewing document', message: title, type: 'info' });
          }
        });

        wrapper.querySelector('.menu-action-edit')?.addEventListener('click', () => {
          closePopovers();
          const editorEl = document.getElementById('s-editor');
          if (editorEl) {
            document.querySelectorAll('#s-list, #s-editor, #s-view').forEach(s => s.classList.add('hidden'));
            editorEl.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'instant' });
          } else {
            window.showToast({ title: 'Editing document', message: title, type: 'info' });
          }
        });

        wrapper.querySelector('.menu-action-pay')?.addEventListener('click', () => {
          closePopovers();
          const payModal = document.getElementById('recordPaymentModal');
          if (payModal) {
            payModal.classList.remove('hidden');
            setTimeout(() => payModal.setAttribute('data-open', 'true'), 10);
          } else {
            window.showToast({ title: 'Payment recording', message: `Open payment modal for ${title}`, type: 'info' });
          }
        });

        wrapper.querySelector('.menu-action-convert')?.addEventListener('click', () => {
          closePopovers();
          window.showToast({
            title: 'Converted to Invoice',
            message: `${title} has been converted to an official Invoice.`,
            type: 'success',
            actionLabel: 'View Invoices',
            onAction: () => { window.location.href = '/'; }
          });
        });

        wrapper.querySelector('.menu-action-download')?.addEventListener('click', () => {
          closePopovers();
          window.showToast({ title: 'Downloading PDF', message: `Generating PDF file for ${title}...`, type: 'info' });
        });

        wrapper.querySelector('.menu-action-cancel')?.addEventListener('click', () => {
          closePopovers();
          const confirmModal = document.getElementById('confirmModal');
          if (confirmModal) {
            confirmModal.classList.remove('hidden');
            setTimeout(() => confirmModal.setAttribute('data-open', 'true'), 10);
          } else {
            window.showToast({
              title: 'Action recorded',
              message: `${title} cancelled.`,
              type: 'danger',
              actionLabel: 'Undo',
              onAction: () => {
                window.showToast({ title: 'Restored', message: `${title} was restored.`, type: 'success' });
              }
            });
          }
        });
      }

      if (isMobile) {
        const w = document.createElement('div');
        w.className = 'sheetwrap fixed inset-0 z-50 flex items-end justify-center before:content-[""] before:absolute before:inset-0 before:bg-[rgba(16,20,50,0.4)]';
        w.onclick = ev => { if (ev.target === w) closePopovers(); };
        w.innerHTML = `
          <div class="sheet relative w-full max-w-[390px] bg-surface rounded-t-xl pt-2 pb-3 px-1 animate-[slideUp_0.15s_ease-out]">
            <div class="w-9 h-1 rounded-sm bg-line-strong mx-auto my-1 mb-2"></div>
            <div class="px-4 py-1 pb-2 text-xs font-semibold text-muted border-b border-line mb-1">${title}</div>
            ${items}
          </div>
        `;
        document.body.appendChild(w);
        wireMenuActions(w);
      } else {
        createScrim();
        const r = b.getBoundingClientRect();
        const p = document.createElement('div');
        p.className = 'popover absolute z-50 bg-surface border border-line-strong rounded shadow-[0_8px_24px_rgba(16,20,50,0.12)] min-w-[210px] p-1.5';
        p.style.top = (r.bottom + window.scrollY + 4) + 'px';
        p.style.left = Math.max(10, (r.right + window.scrollX - 210)) + 'px';
        p.innerHTML = items;
        document.body.appendChild(p);
        wireMenuActions(p);
      }
    });
  </script>
