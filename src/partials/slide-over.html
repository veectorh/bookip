<div id="{{id}}" class="fixed inset-0 z-50 flex justify-end pointer-events-none hidden group/drawer">
  <!-- Scrim -->
  <div class="absolute inset-0 bg-ink/20 pointer-events-auto opacity-0 group-data-[open=true]/drawer:opacity-100 transition-opacity" data-drawer-close="{{id}}"></div>
  
  <!-- Drawer -->
  <div class="w-full max-w-md bg-surface h-full shadow-2xl pointer-events-auto translate-x-full group-data-[open=true]/drawer:translate-x-0 transition-transform flex flex-col z-10 duration-200 cubic-bezier(0.16, 1, 0.3, 1)">
    
    <!-- Header -->
    <div class="flex items-center px-4 py-3 border-b border-line shrink-0">
      <h2 class="m-0 text-lg font-semibold tracking-tight">{{title}}</h2>
      <button class="ml-auto w-8 h-8 rounded flex items-center justify-center text-muted hover:bg-th hover:text-ink -mr-2" data-drawer-close="{{id}}">
        <svg class="w-5 h-5 stroke-2" aria-hidden="true"><use href="#i-x-circle"/></svg>
      </button>
    </div>
    
    <!-- Body -->
    <div class="p-4 overflow-y-auto flex-1 flex flex-col gap-4 text-[13px]">
      {{> @partial-block }}
    </div>
    
    <!-- Footer -->
    <div class="p-4 border-t border-line bg-surface shrink-0 flex gap-2 justify-end">
      <button class="inline-flex items-center justify-center gap-1.5 h-control px-4 rounded border border-line-strong text-[13px] font-medium bg-surface hover:bg-th" data-drawer-close="{{id}}">Cancel</button>
      <button class="inline-flex items-center justify-center gap-1.5 h-control px-4 rounded border border-transparent text-[13px] font-medium bg-indigo text-white hover:bg-indigo-hover" data-drawer-close="{{id}}">{{save_label}}</button>
    </div>
  </div>
</div>
