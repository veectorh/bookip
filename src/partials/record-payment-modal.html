<div id="recordPaymentModal" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none hidden group/modal">
  <!-- Scrim -->
  <div class="absolute inset-0 bg-ink/30 pointer-events-auto opacity-0 group-data-[open=true]/modal:opacity-100 transition-opacity backdrop-blur-[1px]" data-modal-close="recordPaymentModal"></div>
  
  <!-- Dialog -->
  <div class="w-full max-w-md bg-surface rounded-xl shadow-2xl pointer-events-auto scale-95 opacity-0 group-data-[open=true]/modal:scale-100 group-data-[open=true]/modal:opacity-100 transition-all flex flex-col z-10 duration-200 border border-line mx-4 max-h-[90vh] overflow-hidden">
    
    <!-- Header -->
    <div class="flex items-center px-5 py-3.5 border-b border-line shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo/10 text-indigo flex items-center justify-center">
          <svg class="w-4 h-4 stroke-[2]" aria-hidden="true"><use href="#i-wallet"/></svg>
        </div>
        <h2 class="m-0 text-[15px] font-semibold tracking-tight text-ink">Record Payment</h2>
      </div>
      <button class="ml-auto w-7 h-7 rounded flex items-center justify-center text-muted hover:bg-th hover:text-ink -mr-1" data-modal-close="recordPaymentModal">
        <svg class="w-4 h-4 stroke-[2]" aria-hidden="true"><use href="#i-x-circle"/></svg>
      </button>
    </div>
    
    <!-- Body / Form -->
    <form id="recordPaymentForm" class="p-5 overflow-y-auto flex-1 space-y-3.5 text-[13px]" onsubmit="event.preventDefault(); document.getElementById('recordPaymentModal').setAttribute('data-open', 'false'); setTimeout(() => document.getElementById('recordPaymentModal').classList.add('hidden'), 200); window.showToast({ title: 'Payment Recorded', message: 'Payment has been successfully logged.', type: 'success' });">
      <div>
        <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Document</label>
        <div class="px-3 py-2 bg-canvas border border-line rounded text-ink font-medium flex items-center justify-between">
          <span id="recordPaymentDoc">INV-0004 · Ann Kingsley</span>
          <span class="text-xs text-[#B4372A] font-semibold">₦ 75,000.00 due</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="payAmount" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Amount (₦)</label>
          <input type="text" id="payAmount" value="75,000.00" required class="w-full h-control px-3 bg-surface border border-line-strong rounded text-[13px] font-medium text-ink focus:border-indigo focus:ring-[3px] focus:ring-indigo-line outline-none">
        </div>
        <div>
          <label for="payDate" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Payment Date</label>
          <input type="date" id="payDate" value="2026-06-27" required class="w-full h-control px-3 bg-surface border border-line-strong rounded text-[13px] text-ink focus:border-indigo focus:ring-[3px] focus:ring-indigo-line outline-none">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="payMethod" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Method</label>
          <select id="payMethod" class="w-full h-control px-2.5 bg-surface border border-line-strong rounded text-[13px] text-ink focus:border-indigo focus:ring-[3px] focus:ring-indigo-line outline-none">
            <option value="bank_transfer">Bank Transfer</option>
            <option value="cash">Cash</option>
            <option value="pos">POS Terminal</option>
            <option value="cheque">Cheque</option>
          </select>
        </div>
        <div>
          <label for="payAccount" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Deposit Account</label>
          <select id="payAccount" class="w-full h-control px-2.5 bg-surface border border-line-strong rounded text-[13px] text-ink focus:border-indigo focus:ring-[3px] focus:ring-indigo-line outline-none">
            <option value="firstbank">First Bank - 0123456789</option>
            <option value="gtbank">GTBank - 9876543210</option>
            <option value="petty_cash">Petty Cash</option>
          </select>
        </div>
      </div>

      <div>
        <label for="payRef" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Reference / Transaction Note</label>
        <input type="text" id="payRef" placeholder="e.g. NIBSS instant transfer ref / check #104" class="w-full h-control px-3 bg-surface border border-line-strong rounded text-[13px] placeholder-muted text-ink focus:border-indigo focus:ring-[3px] focus:ring-indigo-line outline-none">
      </div>

      <div class="pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" checked class="rounded border-line-strong text-indigo focus:ring-indigo">
          <span class="text-xs text-muted font-medium">Send automatic payment receipt to customer</span>
        </label>
      </div>

      <!-- Footer -->
      <div class="pt-4 border-t border-line flex gap-2 justify-end shrink-0">
        <button type="button" class="inline-flex items-center justify-center gap-1.5 h-control px-3.5 rounded border border-line-strong text-[13px] font-medium bg-surface text-ink hover:bg-th transition-colors shadow-sm" data-modal-close="recordPaymentModal">Cancel</button>
        <button type="submit" class="inline-flex items-center justify-center gap-1.5 h-control px-4 rounded border border-transparent text-[13px] font-medium bg-indigo text-white hover:bg-indigo-hover transition-colors shadow-sm">Save Payment</button>
      </div>
    </form>
  </div>
</div>
