                    <div class="flex flex-col border border-line-strong rounded p-3 bg-canvas">
                      <div class="flex items-start justify-between">
                        <div>
                          <div class="font-medium text-ink">{{name}}</div>
                          <div class="text-xs text-muted mt-0.5">{{qty}} x {{price}} • {{tax}}</div>
                        </div>
                        <div class="text-right">
                          <div class="font-medium font-variant-numeric:tabular-nums text-ink">{{amount}}</div>
                          <button class="mt-2 text-muted hover:text-[#B4372A]"><svg class="w-4 h-4 stroke-[1.75] ml-auto"><use href="#i-trash-2"/></svg></button>
                        </div>
                      </div>
                      <!-- Expanded state mockup -->

                         <div class="flex items-center h-control px-2 bg-surface border border-line-strong rounded text-[13px]"><select class="bg-transparent border-0 outline-none w-full"><option>{{name}}</option></select></div>
                         <div class="flex items-center h-control px-2 bg-surface border border-line-strong rounded text-[13px]"><select class="bg-transparent border-0 outline-none w-full"><option>{{tax}}</option><option>None</option></select></div>

                           <div class="flex-1 flex items-center h-control px-2 bg-surface border border-line-strong rounded text-[13px]"><input type="text" class="bg-transparent border-0 outline-none w-full text-right" value="{{price}}"></div>
                           <div class="w-16 flex items-center h-control px-2 bg-surface border border-line-strong rounded text-[13px]"><input type="text" class="bg-transparent border-0 outline-none w-full text-right" value="{{qty}}"></div>
                         </div>
                         <button class="h-control rounded bg-th font-medium">Done</button>
                      </div>
                    </div>
