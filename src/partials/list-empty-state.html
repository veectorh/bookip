<div class="flex flex-col items-center justify-center py-16 px-4 text-center">
  <div class="w-16 h-16 rounded-full bg-surface border border-line-strong flex items-center justify-center mb-4">
    <svg class="w-6 h-6 text-muted stroke-[1.5]"><use href="{{icon}}"/></svg>
  </div>
  <h3 class="font-medium text-ink mb-1 text-base">{{title}}</h3>
  <p class="text-[13px] text-muted mb-5 max-w-[260px]">{{description}}</p>
  {{#if action_label}}
  <button class="inline-flex items-center gap-1.5 h-control px-4 rounded-pill border border-transparent text-[13px] font-medium bg-indigo text-white hover:bg-indigo-hover" {{action_attr}}>
    <svg class="w-4 h-4 stroke-[1.75]" aria-hidden="true"><use href="#i-plus"/></svg> {{action_label}}
  </button>
  {{/if}}
</div>
