<div class="mb-3.5">
  {{#if section}}
  <div class="text-xs text-muted mb-1.5 flex items-center gap-1.5 font-medium">
    {{section}} <svg class="w-3.5 h-3.5 stroke-[1.75]" aria-hidden="true"><use href="#i-chevron-right"/></svg> {{title}}
  </div>
  {{/if}}

  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <h1 class="m-0 text-xl font-semibold tracking-tight text-ink truncate">{{title}}</h1>
      {{#if count}}
      <span class="text-xs text-muted font-medium bg-canvas px-2 py-0.5 rounded border border-line shrink-0">{{count}}</span>
      {{/if}}
    </div>

    <div class="header-menu-container relative flex items-center gap-1.5 shrink-0">
      {{#if show_export}}
      <!-- Desktop Export Button -->
      <button class="hidden md:inline-flex items-center gap-1.5 h-control px-3 rounded border border-line-strong text-[13px] font-medium bg-surface text-ink hover:bg-th transition-colors shadow-sm" title="Export CSV/Excel">
        <svg class="w-4 h-4 stroke-[1.75]" aria-hidden="true"><use href="#i-download"/></svg>
        <span>{{#if export_label}}{{export_label}}{{else}}Export{{/if}}</span>
      </button>

      <!-- Mobile Kebab Context Menu Trigger -->
      <button type="button" 
              class="header-menu-btn inline-flex md:hidden items-center justify-center w-9 h-9 rounded-lg border border-line-strong bg-surface hover:bg-th text-muted hover:text-ink transition-colors shadow-xs" 
              aria-label="More options" 
              title="More options"
              onclick="toggleHeaderMenu(this, event)">
        <svg class="w-4 h-4 stroke-2" aria-hidden="true"><use href="#i-more-vertical"/></svg>
      </button>

      <!-- Mobile Context Menu Dropdown Popover -->
      <div class="header-menu-dropdown hidden absolute right-10 top-full mt-1.5 w-44 bg-surface border border-line-strong rounded-xl shadow-xl py-1 text-xs text-ink z-50 text-left">
        <button type="button" class="w-full text-left px-3 py-2 text-ink hover:bg-th flex items-center gap-2 cursor-pointer font-medium" onclick="window.showToast({ title: 'Export Generated', message: 'Data exported successfully.', type: 'info' })">
          <svg class="w-4 h-4 stroke-[1.75] text-muted"><use href="#i-download"/></svg>
          <span>{{#if export_label}}{{export_label}}{{else}}Export CSV{{/if}}</span>
        </button>
      </div>
      {{/if}}

      {{#if action_label}}
      <!-- Primary Action CTA (Icon on Mobile, Text on Desktop) -->
      <button class="inline-flex items-center justify-center gap-1.5 h-9 md:h-control px-2.5 md:px-3 rounded-lg md:rounded border border-transparent text-[13px] font-medium bg-indigo text-white hover:bg-indigo-hover transition-colors shadow-sm"
        {{#if action_target}}data-goto="{{action_target}}"{{/if}}
        {{#if action_modal}}data-modal-target="{{action_modal}}"{{/if}}
        {{#if action_drawer}}data-drawer-target="{{action_drawer}}"{{/if}}
        {{#if action_attr}}{{{action_attr}}}{{/if}}
        aria-label="{{action_label}}"
        title="{{action_label}}">
        <svg class="w-4 h-4 stroke-[2]" aria-hidden="true"><use href="#i-plus"/></svg>
        <span class="hidden md:inline">{{action_label}}</span>
      </button>
      {{/if}}
    </div>
  </div>
</div>
