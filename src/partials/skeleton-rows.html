{{#if mobile}}
<!-- Skeleton Cards for Mobile -->
<div class="space-y-2 animate-pulse" aria-hidden="true">
  <div class="bg-surface border border-line rounded p-3.5 space-y-2.5">
    <div class="flex justify-between items-center">
      <div class="h-4 bg-line-strong/60 rounded w-28"></div>
      <div class="h-4 bg-line-strong/60 rounded w-20"></div>
    </div>
    <div class="flex justify-between items-center">
      <div class="h-3 bg-line rounded w-36"></div>
      <div class="h-5 bg-line rounded-full w-16"></div>
    </div>
  </div>
  <div class="bg-surface border border-line rounded p-3.5 space-y-2.5">
    <div class="flex justify-between items-center">
      <div class="h-4 bg-line-strong/60 rounded w-32"></div>
      <div class="h-4 bg-line-strong/60 rounded w-24"></div>
    </div>
    <div class="flex justify-between items-center">
      <div class="h-3 bg-line rounded w-40"></div>
      <div class="h-5 bg-line rounded-full w-14"></div>
    </div>
  </div>
  <div class="bg-surface border border-line rounded p-3.5 space-y-2.5">
    <div class="flex justify-between items-center">
      <div class="h-4 bg-line-strong/60 rounded w-24"></div>
      <div class="h-4 bg-line-strong/60 rounded w-16"></div>
    </div>
    <div class="flex justify-between items-center">
      <div class="h-3 bg-line rounded w-32"></div>
      <div class="h-5 bg-line rounded-full w-20"></div>
    </div>
  </div>
</div>
{{else}}
<!-- Skeleton Rows for Desktop Tables -->
<tbody class="animate-pulse" aria-hidden="true">
  <tr class="border-b border-line">
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line-strong/60 rounded w-20"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-32"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap text-right"><div class="h-3.5 bg-line-strong/60 rounded w-20 ml-auto"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-5 bg-line rounded w-16"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="w-6 h-6 bg-line rounded"></div></td>
  </tr>
  <tr class="border-b border-line">
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line-strong/60 rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-28"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap text-right"><div class="h-3.5 bg-line-strong/60 rounded w-24 ml-auto"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-5 bg-line rounded w-20"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="w-6 h-6 bg-line rounded"></div></td>
  </tr>
  <tr class="border-b border-line">
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line-strong/60 rounded w-16"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-36"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap text-right"><div class="h-3.5 bg-line-strong/60 rounded w-16 ml-auto"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-5 bg-line rounded w-16"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="w-6 h-6 bg-line rounded"></div></td>
  </tr>
  <tr class="border-b border-line">
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line-strong/60 rounded w-20"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-3.5 bg-line rounded w-24"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap text-right"><div class="h-3.5 bg-line-strong/60 rounded w-28 ml-auto"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="h-5 bg-line rounded w-14"></div></td>
    <td class="px-3.5 py-3 whitespace-nowrap"><div class="w-6 h-6 bg-line rounded"></div></td>
  </tr>
</tbody>
{{/if}}
